services:
  takdb:
    image: postgis/postgis@sha256:a2fc46b52819d25add4ed93d3da83e106e17ea3ace6883cce3791631c9820bb2
    env_file: ${TAK_FIXTURE_ENV:?Run through harness.py}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [fixture]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    restart: "no"
  takserver:
    image: ${TAK_SERVER_IMAGE:?Run through harness.py}
    env_file: ${TAK_FIXTURE_ENV:?Run through harness.py}
    environment:
      AUDIT_ENABLED: "false"
      JSON_FORMAT_ENABLED: "false"
    depends_on:
      takdb:
        condition: service_healthy
    ports:
      - target: 8089
        published: "0"
        host_ip: 127.0.0.1
      - target: 8443
        published: "0"
        host_ip: 127.0.0.1
    volumes:
      - server-data:/opt/tak/data
    networks:
      fixture:
        aliases: [takserver]
    healthcheck:
      test: [CMD, test, -f, /opt/tak/data/fixture.ready]
      start_period: 180s
      interval: 3s
      timeout: 3s
      retries: 100
    mem_limit: 5g
    stop_grace_period: 30s
    restart: "no"
networks:
  fixture:
volumes:
  database:
  server-data:
