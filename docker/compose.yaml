x-server-image: &server-image
  image: tak-gateway-server:local
  pull_policy: never

services:
  bootstrap:
    <<: *server-image
    entrypoint: [python3, /bootstrap.py]
    command:
      - secrets
      - --server-dir
      - /run/server-secrets
      - --database-dir
      - /run/database-secrets
      - --server-data
      - /server-data
      - --database-data
      - /database
    read_only: true
    volumes:
      - ./bootstrap.py:/bootstrap.py:ro
      - server-secrets:/run/server-secrets
      - database-secrets:/run/database-secrets
      - server-data:/server-data:ro
      - database:/database:ro
    restart: "no"

  takdb:
    image: postgis/postgis@sha256:a2fc46b52819d25add4ed93d3da83e106e17ea3ace6883cce3791631c9820bb2
    environment:
      POSTGRES_DB: cot
      POSTGRES_USER: martiuser
      POSTGRES_PASSWORD_FILE: /run/database-secrets/password
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - database:/var/lib/postgresql/data
      - database-secrets:/run/database-secrets:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    restart: "no"

  takserver:
    <<: *server-image
    build:
      context: ../tests/tak_server
      dockerfile: Dockerfile.source
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        set -a
        . /run/server-secrets/fixture.env
        exec /bin/bash /opt/tak/fixture-entrypoint.sh
    environment:
      AUDIT_ENABLED: "false"
      JSON_FORMAT_ENABLED: "false"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      takdb:
        condition: service_healthy
    ports:
      - target: 8089
        published: "${TAK_SERVER_TLS_PORT:-8089}"
        host_ip: 127.0.0.1
      - target: 8443
        published: "${TAK_SERVER_REST_PORT:-8443}"
        host_ip: 127.0.0.1
    volumes:
      - server-data:/opt/tak/data
      - server-secrets:/run/server-secrets:ro
    healthcheck:
      test: [CMD, test, -f, /opt/tak/data/fixture.ready]
      start_period: 180s
      interval: 3s
      timeout: 3s
      retries: 100
    mem_limit: 5g
    stop_grace_period: 30s
    restart: "no"

  credentials:
    <<: *server-image
    entrypoint: [python3, /bootstrap.py]
    command:
      - credentials
      - --server-data
      - /server-data
      - --server-secrets
      - /run/server-secrets
      - --output
      - /run/credentials
      - --uid
      - "${TAK_GATEWAY_UID:-1000}"
      - --gid
      - "${TAK_GATEWAY_GID:-1000}"
    depends_on:
      takserver:
        condition: service_healthy
    read_only: true
    volumes:
      - ./bootstrap.py:/bootstrap.py:ro
      - server-data:/server-data:ro
      - server-secrets:/run/server-secrets:ro
      - gateway-credentials:/run/credentials
    restart: "no"

  gateway:
    image: tak-gateway:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    user: "${TAK_GATEWAY_UID:-1000}:${TAK_GATEWAY_GID:-1000}"
    command: ["run"]
    environment:
      TAK_GATEWAY_STATE_DIR: /var/lib/tak-gateway
      TAK_GATEWAY_WEB_BIND: "${TAK_GATEWAY_WEB_BIND:-0.0.0.0:8080}"
      TAK_GATEWAY_OUTPUTS: "${TAK_GATEWAY_OUTPUTS-local=tcp://0.0.0.0:9000}"
      TAK_GATEWAY_STATUS_FILE: /run/tak-gateway/status.json
      TAK_GATEWAY_CONFIG_FILE: "${TAK_GATEWAY_CONFIG_FILE:-}"
      TAK_GATEWAY_IMPORT_ZIP: "${TAK_GATEWAY_IMPORT_ZIP:-}"
      TAK_GATEWAY_SET: >-
        ${TAK_GATEWAY_SET-inputs=[{id="tak",kind="tls",host="takserver",port=8089,
        uid="gateway-reader",protocol="xml-only",
        tls={ca_file="/run/credentials/ca.pem",
        cert_file="/run/credentials/client.pem",
        key_file="/run/credentials/client.key",
        key_password_file="/run/credentials/key-password"}}]}
      TAK_GATEWAY_LOG_LEVEL: "${TAK_GATEWAY_LOG_LEVEL:-}"
      TAK_GATEWAY_LOG_FORMAT: "${TAK_GATEWAY_LOG_FORMAT:-}"
      TMPDIR: /run/tak-gateway
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 5s
    depends_on:
      credentials:
        condition: service_completed_successfully
      takserver:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - target: 9000
        published: "${TAK_GATEWAY_PORT:-9000}"
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./state
        target: /var/lib/tak-gateway
        bind:
          create_host_path: false
      - gateway-credentials:/run/credentials:ro
      - type: bind
        source: ./credentials
        target: /run/imports
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run/tak-gateway:mode=0700,uid=${TAK_GATEWAY_UID:-1000},gid=${TAK_GATEWAY_GID:-1000}

volumes:
  database:
  server-data:
  server-secrets:
  database-secrets:
  gateway-credentials:
